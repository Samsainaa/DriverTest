<!DOCTYPE html>

<html lang="mn">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Жолооны тест</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<script>
    if (!localStorage.getItem("loggedInUser")) {
      window.location.href = "index.html";
    }
  </script>
<button onclick="logout()" style="margin: 10px; background: #f55; color: white; padding: 10px 20px; border: none; border-radius: 6px;">Гарах</button>
<script>
    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    }
  </script>
<!-- ✅ Category Selection Page -->
<div class="category-page" id="categoryPage">
<h1>Жолооны тест</h1>
<div class="category-grid" id="categoryGrid">
<!-- Category buttons will be inserted here by JS -->
</div>
</div>
<!-- ✅ Quiz Page -->
<div class="hidden" id="quizPage">
<div class="navbar sticky">
<div class="navbar-top">
<div class="category-title" id="categoryTitle"></div>
<button onclick="backToCategories()">← Ангилал руу буцах</button>
</div>
<div class="progress-text" id="progressText">Асуулт: 0 / 0</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>
<div class="container">
<form id="quizForm"></form>
<div class="hidden" id="final-result">
<h2 id="scoreText"></h2>
<button id="resetBtn" onclick="restartQuiz()">Шинээр эхлэх</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
