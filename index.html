<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Жолооны тест</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>
    if (!localStorage.getItem("loggedInUser")) {
      window.location.href = "login.html";
    }
  </script>

  <button onclick="logout()" style="margin: 10px; background: #f55; color: white; padding: 10px 20px; border: none; border-radius: 6px;">Гарах</button>
  <script>
    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "login.html";
    }
  </script>

  <div id="categoryPage" class="category-page">
    <h1>Жолооны тест</h1>
    <div class="category-grid" id="categoryGrid"></div>
  </div>

  <div id="quizPage" class="hidden">
    <div class="navbar sticky">
      <button onclick="backToCategories()">← Ангилал руу буцах</button>
      <div id="categoryTitle" class="category-title"></div>
      <div id="progressText" class="progress-text">Асуулт: 0 / 0</div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    </div>

    <div class="container">
      <form id="quizForm"></form>
      <div id="final-result" class="hidden">
        <h2 id="scoreText"></h2>
        <button id="resetBtn" onclick="restartQuiz()">Шинээр эхлэх</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
