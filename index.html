<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOGIN</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* Overall page styling */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f0f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main login container */
    .container {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 320px;
      text-align: center;
    }

    /* Title */
    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 700;
    }

    /* Input wrappers */
    .input-box {
      position: relative;
      margin-bottom: 20px;
    }

    /* Icons inside input */
    .input-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
      font-size: 16px;
    }

    /* Input fields */
    .input-box input {
      width: 80%;
      padding: 12px 16px 12px 40px;
      border: none;
      border-radius: 12px;
      background-color: #f4f3ff;
      font-size: 14px;
    }

    /* Show password checkbox */
    .show-password {
      display: flex;
      align-items: center;
      font-size: 13px;
      justify-content: flex-start;
      margin-bottom: 15px;
    }

    .show-password input {
      margin-right: 6px;
    }

    /* Login button */
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8e90ed, #696cf5);
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
    }

    /* Error message */
    #message {
      color: red;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>LOGIN</h2>

    <!-- Username field -->
    <div class="input-box">
      <i class="fas fa-user"></i>
      <input type="text" id="username" placeholder="Username" />
    </div>

    <!-- Password field -->
    <div class="input-box">
      <i class="fas fa-lock"></i>
      <input type="password" id="password" placeholder="Password" />
    </div>

    <!-- Show password toggle -->
    <div class="show-password">
      <input type="checkbox" id="togglePassword" onclick="togglePasswordVisibility()" />
      <label for="togglePassword">Show password</label>
    </div>

    <!-- Login button -->
    <button onclick="signIn()">Login Now</button>

    <!-- Error display -->
    <p id="message"></p>
  </div>

  <script>
    // Hardcoded users (you can connect to a backend later)
    const users = {
      "Davaa": "Davaa123",
      "Uuganaa": "Uuganaa123",
      "Sainbayar": "Sainbayar123",
      "Bataa": "Bataa123",
      "Dorj": "Dorj123"
    };

    function signIn() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (users[username] && users[username] === password) {
        window.location.href = "quiz.html"; // redirect on success
      } else {
        document.getElementById("message").innerText = "Invalid username or password.";
      }
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById("password");
      passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
